<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만능 컬러 피커 카드</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        .color-picker-card {
            background: white;
            width: 380px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .card-subtitle {
            color: #666;
            font-size: 0.9rem;
            margin: 5px 0 0;
        }

        /* 메인 2D 피커 영역 (S/V) */
        .sv-picker-container {
            width: 100%;
            height: 250px;
            position: relative;
            margin-bottom: 15px;
            cursor: crosshair;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #eee;
        }

        #sv-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sv-pointer {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* 1D Hue 슬라이더 */
        .hue-slider-container {
            width: 100%;
            height: 20px;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
        }

        #hue-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hue-pointer {
            width: 10px;
            height: 24px;
            background: white;
            border-radius: 5px;
            position: absolute;
            top: -2px;
            transform: translateX(-50%);
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
            pointer-events: none;
            border: 1px solid #ccc;
        }

        /* 색상 정보 패널 */
        .info-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .color-preview {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .code-group {
            flex-grow: 1;
            margin-left: 20px;
        }

        .code-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: #444;
            margin: 5px 0;
        }

    </style>
</head>
<body>

    <div class="color-picker-card">
        <div class="card-header">
            <h1 class="card-title">Universal Color Picker</h1>
            <p class="card-subtitle">RGB & HEX</p>
        </div>

        <div class="sv-picker-container" id="sv-container">
            <canvas id="sv-canvas"></canvas>
            <div class="sv-pointer" id="sv-pointer" style="left: 50%; top: 50%;"></div>
        </div>

        <div class="hue-slider-container" id="hue-container">
            <canvas id="hue-canvas"></canvas>
            <div class="hue-pointer" id="hue-pointer" style="left: 50%;"></div>
        </div>

        <div class="info-panel">
            <div id="preview" class="color-preview" style="background-color: #ffffff;"></div>
            <div class="code-group">
                <div class="code-display" id="hex-code">HEX: #FFFFFF</div>
                <div class="code-display" id="rgb-code">RGB: (255, 255, 255)</div>
            </div>
        </div>
    </div>

    <script>
        // HSV에서 RGB로 변환하는 함수
        function hsvToRgb(h, s, v) {
            h /= 360; s /= 100; v /= 100;
            let r, g, b;
            let i = Math.floor(h * 6);
            let f = h * 6 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
        }

        // RGB를 Hex로 변환하는 함수
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        const svCanvas = document.getElementById('sv-canvas');
        const svCtx = svCanvas.getContext('2d', { willReadFrequently: true });
        const hueCanvas = document.getElementById('hue-canvas');
        const hueCtx = hueCanvas.getContext('2d');

        const svPointer = document.getElementById('sv-pointer');
        const huePointer = document.getElementById('hue-pointer');
        const preview = document.getElementById('preview');
        const hexDisplay = document.getElementById('hex-code');
        const rgbDisplay = document.getElementById('rgb-code');

        // 상태 변수 (초기값: 흰색)
        let currentHue = 0; // 0-360
        let currentSat = 0; // 0-100
        let currentVal = 100; // 0-100

        // 캔버스 크기 설정
        function resizeCanvas() {
            svCanvas.width = svCanvas.offsetWidth;
            svCanvas.height = svCanvas.offsetHeight;
            hueCanvas.width = hueCanvas.offsetWidth;
            hueCanvas.height = hueCanvas.offsetHeight;
            drawHueSlider();
            drawSvSquare();
        }

        // 1. Hue 슬라이더 그리기
        function drawHueSlider() {
            const width = hueCanvas.width;
            const height = hueCanvas.height;
            const grd = hueCtx.createLinearGradient(0, 0, width, 0);
            grd.addColorStop(0, "rgb(255, 0, 0)"); // Red
            grd.addColorStop(0.17, "rgb(255, 255, 0)"); // Yellow
            grd.addColorStop(0.33, "rgb(0, 255, 0)"); // Green
            grd.addColorStop(0.50, "rgb(0, 255, 255)"); // Cyan
            grd.addColorStop(0.67, "rgb(0, 0, 255)"); // Blue
            grd.addColorStop(0.83, "rgb(255, 0, 255)"); // Magenta
            grd.addColorStop(1, "rgb(255, 0, 0)"); // Red
            hueCtx.fillStyle = grd;
            hueCtx.fillRect(0, 0, width, height);
        }

        // 2. S/V 정사각형 그리기 (현재 Hue 기반)
        function drawSvSquare() {
            const width = svCanvas.width;
            const height = svCanvas.height;

            // 기본 색상 배경
            const rgb = hsvToRgb(currentHue, 100, 100);
            const baseColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            svCtx.fillStyle = baseColor;
            svCtx.fillRect(0, 0, width, height);

            // 가로 흰색 그라데이션 (명도 조절)
            const whiteGrd = svCtx.createLinearGradient(0, 0, width, 0);
            whiteGrd.addColorStop(0, "rgba(255, 255, 255, 1)");
            whiteGrd.addColorStop(1, "rgba(255, 255, 255, 0)");
            svCtx.fillStyle = whiteGrd;
            svCtx.fillRect(0, 0, width, height);

            // 세로 검은색 그라데이션 (채도 조절)
            const blackGrd = svCtx.createLinearGradient(0, height, 0, 0);
            blackGrd.addColorStop(0, "rgba(0, 0, 0, 1)");
            blackGrd.addColorStop(1, "rgba(0, 0, 0, 0)");
            svCtx.fillStyle = blackGrd;
            svCtx.fillRect(0, 0, width, height);
        }

        // 3. UI 업데이트
        function updateDisplay() {
            const {r, g, b} = hsvToRgb(currentHue, currentSat, currentVal);
            const hex = rgbToHex(r, g, b);
            
            preview.style.backgroundColor = hex;
            hexDisplay.innerText = `HEX: ${hex}`;
            rgbDisplay.innerText = `RGB: (${r}, ${g}, ${b})`;
        }

        // 이벤트 처리
        function handleHueClick(e) {
            const rect = hueCanvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width)); // 범위 제한

            currentHue = (x / rect.width) * 360;
            huePointer.style.left = `${x}px`;
            
            drawSvSquare(); // S/V 정사각형 업데이트
            updateDisplay();
        }

        function handleSvClick(e) {
            const rect = svCanvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            x = Math.max(0, Math.min(x, rect.width)); // 범위 제한
            y = Math.max(0, Math.min(y, rect.height));

            currentSat = (x / rect.width) * 100;
            currentVal = 100 - (y / rect.height) * 100;

            svPointer.style.left = `${x}px`;
            svPointer.style.top = `${y}px`;

            updateDisplay();
        }

        // 초기화 및 드래그 지원
        window.addEventListener('load', () => {
            resizeCanvas();
            updateDisplay(); // 초기 상태 반영
        });
        window.addEventListener('resize', resizeCanvas);

        // 마우스 및 터치 이벤트 통합
        function addInteractive(container, handler) {
            let isDragging = false;
            const startHandler = (e) => {
                isDragging = true;
                handler(e.touches ? e.touches[0] : e);
            };
            const moveHandler = (e) => {
                if (isDragging) {
                    handler(e.touches ? e.touches[0] : e);
                }
            };
            const endHandler = () => { isDragging = false; };

            container.addEventListener('mousedown', startHandler);
            window.addEventListener('mousemove', moveHandler);
            window.addEventListener('mouseup', endHandler);

            container.addEventListener('touchstart', startHandler);
            window.addEventListener('touchmove', moveHandler);
            window.addEventListener('touchend', endHandler);
        }

        addInteractive(document.getElementById('hue-container'), handleHueClick);
        addInteractive(document.getElementById('sv-container'), handleSvClick);

    </script>
</body>
</html>
